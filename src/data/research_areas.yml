- id: herbicide-physiology
  title: Herbicide Physiology
  icon: sprout
  image: /img/placeholder-lab.svg
  blurb: How herbicides are absorbed, translocated, and metabolized — and how weeds evolve resistance.
  description: >-
    The lab studies how herbicides enter plants, move to their target sites, and are broken down,
    and how weed populations such as *Echinochloa colona* and *Sagittaria montevidensis* evolve
    target-site and metabolic resistance. Work combines whole-plant dose–response assays with
    biochemical and gene-expression analyses. TODO: owner to expand to 100–150 words.
  questions:
    - Which metabolic pathways confer multiple resistance in barnyardgrass and junglerice?
    - How does environmental stress change herbicide uptake and efficacy?
    - TODO
